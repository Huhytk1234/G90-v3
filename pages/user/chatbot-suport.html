<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Hỗ Trợ - Petcare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/user.css">
</head>
<body>
    <!-- Banner Chatbot -->
    <div class="promo-banner position-relative text-center text-white">
        <img src="/assets/images/banner.png" alt="Khuyến mãi" class="img-fluid w-100 banner-img">
        <div class="banner-overlay position-absolute top-50 start-50 translate-middle">
            <h1 class="fw-bold">CHATBOT</h1>
            <nav class="mt-3">
                <a href="../home.html" class="text-white text-decoration-none fw-light">TRANG CHỦ</a>
                <span class="mx-2">•</span>
                <span class="text-white fw-light">CHATBOT</span>
            </nav>
        </div>  
    </div>

    <!-- Chatbot Section -->
    <div class="container chatbot-section py-5">
        <h1 class="text-center mb-5">Chatbot Hỗ Trợ</h1>
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="text-center">
                    <iframe 
                        src="https://www.chatbase.co/chatbot-iframe/Tu8zUKzOWNFB3QTWCzyy3" 
                        title="Chatbot Petcare"
                        width="100%" 
                        height="600" 
                        style="border:none;" 
                        allow="clipboard-write; clipboard-read">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <div id="footer"></div>
    <div id="modalContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load footer and modal HTML
        fetch('../../components/footer.html')
            .then(response => response.text())
            .then(data => document.getElementById('footer').innerHTML = data);

        fetch('../../components/modal.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('modalContainer').innerHTML = data;
            });
    </script>
</body>
</html>
