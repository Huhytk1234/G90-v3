<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông Tin Cá Nhân</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">Thông Tin Cá Nhân</h2>
    <div class="card shadow p-4 rounded-4">
      <div class="row mb-3">
        <label class="col-sm-3 col-form-label fw-bold">Họ tên:</label>
        <div class="col-sm-9">
          <p class="form-control-plaintext user-name">...</p>
        </div>
      </div>
      <div class="row mb-3">
        <label class="col-sm-3 col-form-label fw-bold">Email:</label>
        <div class="col-sm-9">
          <p class="form-control-plaintext user-email">...</p>
        </div>
      </div>
      <div class="row mb-3">
        <label class="col-sm-3 col-form-label fw-bold">Số điện thoại:</label>
        <div class="col-sm-9">
          <p class="form-control-plaintext user-phone">...</p>
        </div>
      </div>
      <div class="row mb-3">
        <label class="col-sm-3 col-form-label fw-bold">Địa chỉ:</label>
        <div class="col-sm-9">
          <p class="form-control-plaintext user-address">...</p>
        </div>
      </div>
      <div class="text-end">
        <button class="btn btn-danger rounded-3" onclick="logout()">Đăng xuất</button>
      </div>
    </div>
  </div>

  <!-- Modal chung -->
  <div id="modalContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Tải modal chung
    fetch('../../components/modal.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('modalContainer').innerHTML = html;
      });

    // Hiển thị thông tin người dùng
    const user = JSON.parse(localStorage.getItem("loggedInUser"));

    if (!user) {
      window.location.href = "../../pages/auth/login.html";
    } else {
      document.querySelector(".user-name").textContent = user.hoTen;
      document.querySelector(".user-email").textContent = user.email;
      document.querySelector(".user-phone").textContent = user.soDienThoai || "Chưa cập nhật";
      document.querySelector(".user-address").textContent = user.diaChi || "Chưa cập nhật";
    }

    // Đăng xuất
    function logout() {
      localStorage.removeItem("loggedInUser");
      window.location.href = "../../pages/auth/login.html";
    }
  </script>
</body>
</html>
